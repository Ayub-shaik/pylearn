resolver 127.0.0.11 valid=30s;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Baseline hardening headers — cheap to add, no functional cost.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Dev/debug-only guest login must never be reachable from the public
    # internet — block it here even though it's also gated server-side by
    # DEV_GUEST_LOGIN_ENABLED. Test it via `docker compose exec api curl
    # localhost:8081/api/auth/guest ...` instead.
    location = /api/auth/guest {
        return 404;
    }

    location /api/ {
        set $api_upstream http://api:8081;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / /;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
